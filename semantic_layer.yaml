# ============================================================================
# SEMANTIC LAYER — "описание данных в LLM-формате"
# LLM обращается СЮДА, а не к сырой схеме. Это снижает галлюцинации:
# модель выбирает из сертифицированных метрик/измерений, а не выдумывает SQL.
# ============================================================================

dataset: broker
description: >
  Данные онлайн-брокера: трейдеры (clients), их депозиты (deposits) и
  торговые сделки (trades). Демо-счета исключаются из денежных метрик.

# --- KNOWLEDGE / ГЛОССАРИЙ: бизнес-правила и особенности данных ---
# Подается в промпт LLM. Снимает целый класс ошибок интерпретации:
# модель не догадывается о правилах — ей надо их сказать явно.
business_context: >
  ПЕРИОД ДАННЫХ: 2025-01-01 … 2026-06-30. Данных вне этого диапазона нет.

  ДЕМО-СЧЕТА: клиенты с is_demo = TRUE исключаются из ВСЕХ денежных метрик.
  Демо не вносят реальных денег. Если спрашивают «вместе с демо» — это
  выходит за рамки сертифицированных метрик, считать нужно ad-hoc и
  явно пометить, что результат нестандартный.

  ДЕПОЗИТ: засчитывается ТОЛЬКО статус 'confirmed'. Статусы 'pending' и
  'failed' в депозитных метриках не участвуют — это отказы и незавершенные
  платежи, а не деньги на счету.

  ВОРОНКА: регистрация → депозит → торговля. Торгуют только клиенты
  с подтвержденным депозитом. Поэтому active_traders всегда меньше клиентов.

  АКТИВНЫЙ ТРЕЙДЕР = клиент, совершивший хотя бы одну сделку за период.
  Не путать с client_count — это все зарегистрированные клиенты.

  МАРКЕТИНГ: канал organic бесплатный, в marketing_spend его нет.
  Планы (targets) заданы по кварталам, только для total_deposits и
  trading_volume.

  ВАЛЮТА: все суммы в USD. Баланса счетов в данных НЕТ — только депозиты,
  обороты и PnL по сделкам.

# --- РОЛИ: кто какие метрики имеет право видеть (governance / RLS-lite) ---
# Семантический слой = контракт, поэтому доступ логично описывать здесь же.
# Метрика, недоступная роли, не попадает ни в каталог LLM, ни в валидацию,
# ни в определения — как будто ее нет. Модель не может «обойти» ограничение.
roles:
  board:                       # топ-менеджмент — видит все
    label: "Board / C-level"
    metrics: "*"
  finance:                     # финансы — деньги и планы, без маркетинг-бюджетов
    label: "Finance"
    metrics: [total_deposits, deposit_count, avg_deposit, net_pnl,
              trading_volume, client_count, active_traders]
  manager:                     # операционный менеджер — БЕЗ чувствительного
    label: "Operations manager"
    metrics: [total_deposits, deposit_count, avg_deposit,
              client_count, active_traders, trading_volume]
    # скрыто: net_pnl (клиентский финрез), marketing_cost (рекламные бюджеты)

# --- ИЗМЕРЕНИЯ: по чему МОЖНО резать метрики ---
dimensions:
  country:
    sql: clients.country
    synonyms: [страна, гео, регион, geo]
    description: >
      Страна клиента. Значения хранятся ПО-АНГЛИЙСКИ — при фильтре по русскому
      названию подставляй английское: Кипр=Cyprus, Таиланд=Thailand,
      ЮАР=South Africa, Индонезия=Indonesia, Нигерия=Nigeria, Вьетнам=Vietnam,
      ОАЭ=UAE, Индия=India, Бразилия=Brazil, Кения=Kenya.
    sample_values: [Cyprus, Thailand, South Africa, Indonesia, Nigeria,
                    Vietnam, UAE, India, Brazil, Kenya]
  account_type:
    sql: clients.account_type
    synonyms: [тип счета, тип аккаунта, account]
    description: >
      Тип торгового счета. "Standard Cent" — центовый счет (мелкие объемы),
      "Pro"/"Raw Spread"/"Zero" — профессиональные типы с разными спредами.
    sample_values: [Standard, Standard Cent, Pro, Raw Spread, Zero]
  acquisition_channel:
    sql: clients.acquisition_channel
    synonyms: [канал, канал привлечения, источник, channel, marketing channel]
    description: >
      Канал привлечения клиента: organic — органика, google_ads — гугл-реклама,
      facebook — фейсбук, affiliate — партнерка, referral — реферальная программа.
    sample_values: [organic, google_ads, facebook, affiliate, referral]
  symbol:
    sql: trades.symbol
    synonyms: [инструмент, тикер, символ, пара]
    description: >
      Торговый инструмент: XAUUSD — золото, BTCUSD — биткоин/крипта,
      USOIL — нефть, US500 — индекс S&P 500, AAPL — акции Apple,
      EURUSD и GBPUSD — валютные пары.
    sample_values: [EURUSD, XAUUSD, BTCUSD, GBPUSD, USOIL, US500, AAPL]
  deposit_month:
    sql: date_trunc('month', deposits.deposit_date)
    synonyms: [месяц, месяцам, динамика]
    grain: month
  trade_month:
    sql: date_trunc('month', trades.trade_date)
    synonyms: [месяц, месяцам, динамика]
    grain: month
  mkt_channel:
    sql: marketing_spend.channel
    synonyms: [канал маркетинга, рекламный канал, канал расходов]
    description: >
      Канал, на который потрачен рекламный бюджет (organic бесплатен и в
      расходах не участвует).
    sample_values: [google_ads, facebook, affiliate, referral]
  spend_month:
    sql: date_trunc('month', marketing_spend.spend_date)
    synonyms: [месяц, месяцам, динамика]
    grain: month

# --- МЕТРИКИ: каждая = контракт (expression + grain + filters + owner) ---
metrics:
  total_deposits:
    label: "Total Deposits, $"
    description: >
      Сумма подтвержденных депозитов в USD. Только реальные счета (не демо),
      только status='confirmed'. Это основной денежный показатель притока.
    expression: "SUM(deposits.amount_usd)"
    table: deposits
    filters_builtin: "deposits.status = 'confirmed' AND clients.is_demo = FALSE"
    allowed_dimensions: [country, account_type, acquisition_channel, deposit_month]
    format: currency_usd
    owner: finance_analytics
    synonyms: [депозиты, пополнения, объем депозитов, внесения, сумма депозитов,
               выручка, приток, приток средств, GMV, gmv, оборот по депозитам]
    example_questions:
      - "сколько всего внесли депозитов"
      - "депозиты по странам"
      - "динамика притока по месяцам"

  deposit_count:
    label: "Number of Deposits"
    description: "Количество подтвержденных депозитов (реальные счета)."
    expression: "COUNT(deposits.deposit_id)"
    table: deposits
    filters_builtin: "deposits.status = 'confirmed' AND clients.is_demo = FALSE"
    allowed_dimensions: [country, account_type, acquisition_channel, deposit_month]
    format: integer
    owner: finance_analytics
    synonyms: [число депозитов, количество пополнений]
    example_questions:
      - "сколько было пополнений"
      - "число депозитов по каналам"

  avg_deposit:
    label: "Average Deposit, $"
    description: "Средний размер подтвержденного депозита (реальные счета)."
    expression: "AVG(deposits.amount_usd)"
    table: deposits
    filters_builtin: "deposits.status = 'confirmed' AND clients.is_demo = FALSE"
    allowed_dimensions: [country, account_type, acquisition_channel, deposit_month]
    format: currency_usd
    owner: finance_analytics
    synonyms: [средний депозит, средний чек депозита]
    example_questions:
      - "средний чек депозита"
      - "средний депозит по типам счетов"

  client_count:
    label: "Clients"
    description: >
      Число зарегистрированных клиентов (реальные счета, не демо).
      Это ВСЕ клиенты — в отличие от active_traders, где только совершившие сделку.
    expression: "COUNT(DISTINCT clients.client_id)"
    table: clients
    filters_builtin: "clients.is_demo = FALSE"
    allowed_dimensions: [country, account_type, acquisition_channel]
    format: integer
    owner: product_analytics
    synonyms: [клиенты, число клиентов, количество клиентов, сколько клиентов,
               пользователи, зарегистрированные, база клиентов]
    example_questions:
      - "сколько у нас клиентов"
      - "клиенты по странам"
      - "база клиентов по каналам"

  active_traders:
    label: "Active Traders"
    description: >
      Число уникальных клиентов, совершивших хотя бы одну сделку.
      Активный трейдер = есть запись в trades.
    expression: "COUNT(DISTINCT trades.client_id)"
    table: trades
    filters_builtin: "clients.is_demo = FALSE"
    allowed_dimensions: [symbol, trade_month, country, account_type, acquisition_channel]
    format: integer
    owner: product_analytics
    synonyms: [активные трейдеры, активные клиенты, трейдеры, кто торгует]
    example_questions:
      - "сколько активных трейдеров"
      - "динамика активных клиентов по месяцам"

  trading_volume:
    label: "Trading Volume, $"
    description: "Суммарный торговый оборот в USD по сделкам (реальные счета)."
    expression: "SUM(trades.volume_usd)"
    table: trades
    filters_builtin: "clients.is_demo = FALSE"
    allowed_dimensions: [symbol, trade_month, country, account_type, acquisition_channel]
    format: currency_usd
    owner: product_analytics
    synonyms: [оборот, торговый объем, объем торгов, volume, turnover]
    example_questions:
      - "торговый оборот по инструментам"
      - "топ-5 стран по обороту"

  net_pnl:
    label: "Client Net PnL, $"
    description: "Суммарный финансовый результат клиентов по сделкам (может быть отрицательным)."
    expression: "SUM(trades.pnl_usd)"
    table: trades
    filters_builtin: "clients.is_demo = FALSE"
    allowed_dimensions: [symbol, trade_month, country, account_type, acquisition_channel]
    format: currency_usd
    owner: product_analytics
    synonyms: [pnl, прибыль клиентов, финрез, результат по сделкам]
    example_questions:
      - "прибыль клиентов по инструментам"
      - "финрез по странам"

  marketing_cost:
    label: "Marketing Spend, $"
    description: >
      Расходы на привлечение (маркетинг) в USD по каналам и месяцам.
      Это расходная часть — то, что тратим на привлечение клиентов.
    expression: "SUM(marketing_spend.cost_usd)"
    table: marketing_spend
    allowed_dimensions: [mkt_channel, spend_month]
    format: currency_usd
    owner: marketing_analytics
    synonyms: [расходы, расходная часть, затраты, маркетинг, рекламный бюджет, spend, costs]
    example_questions:
      - "расходы на маркетинг по каналам"
      - "сколько потратили на привлечение"

# --- FEW-SHOT: пары "вопрос -> выбор". Главный рычаг точности NL-to-SQL. ---
examples:
  - q: "сколько всего внесли депозитов"
    pick: {metric: total_deposits}
  - q: "депозиты по странам"
    pick: {metric: total_deposits, group_by: [country]}
  - q: "средний депозит по типам счетов"
    pick: {metric: avg_deposit, group_by: [account_type]}
  - q: "сколько активных трейдеров"
    pick: {metric: active_traders}
  - q: "торговый оборот по инструментам за 2026"
    pick: {metric: trading_volume, group_by: [symbol], filters: {year: 2026}}
  - q: "топ-5 стран по депозитам"
    pick: {metric: total_deposits, group_by: [country], order: desc, limit: 5}
  - q: "динамика депозитов по месяцам"
    pick: {metric: total_deposits, group_by: [deposit_month]}
  - q: "расходы на маркетинг по каналам"
    pick: {metric: marketing_cost, group_by: [mkt_channel]}
  # --- относительные периоды (движок считает даты сам) ---
  - q: "депозиты за последний квартал"
    pick: {metric: total_deposits, filters: {period: last_quarter}}
  - q: "оборот в прошлом месяце по странам"
    pick: {metric: trading_volume, group_by: [country], filters: {period: last_month}}
  - q: "динамика депозитов за последние 3 месяца"
    pick: {metric: total_deposits, group_by: [deposit_month], filters: {last_n_months: 3}}
  - q: "сколько депозитов с начала года"
    pick: {metric: total_deposits, filters: {period: ytd}}
  # --- суперлатив «худший» -> order asc ---
  - q: "инструменты с худшей прибылью клиентов"
    pick: {metric: net_pnl, group_by: [symbol], order: asc}
